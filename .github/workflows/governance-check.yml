name: Governance checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s maintainers/tests -v
      - name: Product packager tests
        run: python -m unittest discover -s .agents/skills/pm-prototype-packager/tests -v
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: starters/vue-prototype/package-lock.json
      - name: Install Vue starter dependencies
        run: npm ci
        working-directory: starters/vue-prototype
      - name: Check Vue starter types
        run: npm run typecheck
        working-directory: starters/vue-prototype
      - name: Build and verify Vue starter preview
        run: npm run preview:pack
        working-directory: starters/vue-prototype
      - name: Test Vue starter preview verifier
        run: npm run test:preview-verify
        working-directory: starters/vue-prototype
      - name: Public content and risk
        if: github.event_name == 'pull_request'
        run: python maintainers/scripts/check_public_content.py --root . --base-ref origin/${{ github.base_ref }}
      - name: Public content on main
        if: github.event_name != 'pull_request'
        run: python maintainers/scripts/check_public_content.py --root .
      - name: Markdown links
        run: python maintainers/scripts/check_markdown_links.py .
