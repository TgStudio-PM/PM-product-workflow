name: Governance checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Public content and risk
        if: github.event_name == 'pull_request'
        run: python scripts/check_public_content.py --root . --base-ref origin/${{ github.base_ref }}
      - name: Public content on main
        if: github.event_name != 'pull_request'
        run: python scripts/check_public_content.py --root .
      - name: Markdown links
        run: python scripts/check_markdown_links.py .
